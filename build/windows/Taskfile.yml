version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: 构建 Windows 程序
    internal: true
    cmds:
      - task: build:native
        vars:
          ARCH:
            ref: .ARCH
          OUTPUT:
            ref: .OUTPUT
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          EXTRA_TAGS:
            ref: .EXTRA_TAGS
          DEV:
            ref: .DEV
          SCAN:
            ref: .SCAN

  build:native:
    summary: 使用 Go 原生交叉编译构建 Windows 程序
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
          SCAN:
            ref: .SCAN
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH:
            ref: .ARCH
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
      - task: sign:authenticode
        vars:
          TARGET:
            ref: .OUTPUT
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [darwin, linux]
    vars:
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s.exe" .BIN_DIR .APP_NAME)}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l" -ldflags="-X cursor/internal/buildinfo.Version={{.APP_VERSION}}"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X cursor/internal/buildinfo.Version={{.APP_VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: 打包 Windows 安装程序
    internal: true
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'

  generate:syso:
    summary: 生成 Windows 图标与版本信息资源
    internal: true
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: 生成 NSIS 安装包
    internal: true
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          SCAN:
            ref: .SCAN
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
      - task: sign:authenticode
        vars:
          TARGET: '{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}-installer.exe'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'

  create:msix:package:
    summary: 生成 MSIX 安装包（需要包含 msix 工具的 Wails CLI）
    internal: true
    preconditions:
      - sh: 'wails3 tool --help 2>&1 | grep -Eq "^[[:space:]]*msix([[:space:]]|$)"'
        msg: "当前 Wails CLI 不支持 'wails3 tool msix'。请使用 NSIS（默认格式），或升级到包含 MSIX 工具的 Wails CLI 后再执行 FORMAT=msix。"
    deps:
      - task: build
        vars:
          SCAN:
            ref: .SCAN
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/wails.json" \
          --name "{{.APP_NAME}}" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if .USE_MSIX_TOOL}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  sign:authenticode:
    summary: 使用证书存储中的 SHA-1 指纹签名 Windows PE 产物
    internal: true
    vars:
      TARGET: '{{.TARGET}}'
    preconditions:
      - sh: 'test -n "{{.TARGET}}"'
        msg: "Windows 签名目标不能为空。"
      - sh: 'test -z "{{.WINDOWS_SIGN_CERT_SHA1}}" || command -v signtool >/dev/null 2>&1'
        msg: "配置 WINDOWS_SIGN_CERT_SHA1 后必须安装 signtool。"
    cmds:
      - |
        {{if .WINDOWS_SIGN_CERT_SHA1}}
        signtool sign /sha1 "{{.WINDOWS_SIGN_CERT_SHA1}}" /fd SHA256 /tr "{{.WINDOWS_SIGN_TIMESTAMP_URL}}" /td SHA256 "{{.TARGET}}"
        signtool verify /pa /v "{{.TARGET}}"
        {{else}}
        echo "未设置 WINDOWS_SIGN_CERT_SHA1，跳过 Windows 签名：{{.TARGET}}"
        {{end}}

  create:zip:
    summary: 生成 Windows ZIP 包（包含 exe 与 certs）
    internal: true
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s.exe" .BIN_DIR .APP_NAME)}}'
      ZIP_NAME: '{{.ZIP_NAME | default (printf "%s-windows-%s.zip" .APP_NAME .ARCH)}}'
      STAGING_DIR: '{{.BIN_DIR}}/.zip-{{.ARCH}}'
    cmds:
      - task: build
        vars:
          ARCH:
            ref: .ARCH
          OUTPUT:
            ref: .OUTPUT
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          EXTRA_TAGS:
            ref: .EXTRA_TAGS
          DEV:
            ref: .DEV
          SCAN:
            ref: .SCAN
      - rm -rf "{{.STAGING_DIR}}"
      - mkdir -p "{{.STAGING_DIR}}"
      - cp "{{.OUTPUT}}" "{{.STAGING_DIR}}/"
      - (cd "{{.STAGING_DIR}}" && zip -qry "../{{.ZIP_NAME}}" .)
      - rm -rf "{{.STAGING_DIR}}"
      - rm -f "{{.OUTPUT}}"

  run:
    summary: 运行 Windows 可执行文件（仅在 Windows 可用）
    vars:
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s.exe" .BIN_DIR .APP_NAME)}}'
    cmds:
      - '{{.OUTPUT}}'
