[workspace]
members = [
    "server",
    "apps/desktop/src-tauri",
    "crates/semble-core",
    "support/benchmarks/semble",
]
resolver = "2"

# Keep dependency debug info compact, while retaining incremental artifacts
# for local development so editing our large Rust crates does not rebuild them
# from scratch. Test builds still avoid incremental object caches.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
